services:
  - type: web
    name: vera-ai-backend
    env: python
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "uvicorn bot:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: TEAM_NAME
        value: "MULTIBOTS"
      - key: NODE_VERSION
        value: "20"
